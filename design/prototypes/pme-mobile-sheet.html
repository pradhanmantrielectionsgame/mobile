<title>Pradhan Mantri — Booth Ink</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PME Booth">
<meta name="theme-color" content="#EEF0F3">
<style>
:root{
  --page:#EEF0F3; --surface:#FFFFFF; --surface2:#F7F8FA; --track:#E4E7EC;
  --ink:#14161C; --ink-soft:#4B5160; --ink-faint:#8890A0;
  --line:#14161C; --rule:#D8DCE3;
  --accent:#2451D6; --accent-ink:#FFFFFF;
  --stamp:#B3311D;
  --p1:#E8871C; --p2:#1C8A4B; --map-base:#E4E7EC; --map-stroke:#14161C;
  --font: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overscroll-behavior:none;}
body{ font-family:var(--font); background:var(--page); color:var(--ink); }
button{ font-family:inherit; border:none; background:none; color:inherit; }
@media (prefers-reduced-motion: reduce){ *{ transition-duration:.01ms !important; animation-duration:.01ms !important; } }

/* Three fixed regions stacked in a column — header, map, info panel. Nothing
   overlaps, nothing expands, so no element's position ever depends on
   another's runtime size. */
.stage{ position:fixed; inset:0; overflow:hidden; display:flex; flex-direction:column; }

/* ---- topstrip: ballot-header band. Seat bar + phase, then a slim players
   readout — small, glanceable. ---- */
.topstrip{ flex:0 0 auto; padding:calc(env(safe-area-inset-top,0px) + 15px) 27px 21px; background:var(--surface); border-bottom:3px solid var(--line); }
.seatbar{ display:flex; height:15px; border:3px solid var(--line); border-radius:6px; overflow:hidden; background:var(--track); margin-bottom:18px; }
.seatbar .seg.p1{ background:var(--p1); } .seatbar .seg.p2{ background:var(--p2); } .seatbar .seg.oth{ background:transparent; }
.topstrip-row{ display:flex; align-items:center; justify-content:space-between; }
.phase-chip{ font-family:var(--font-mono); font-size:35px; font-weight:700; color:var(--ink-soft); letter-spacing:.01em; }
.phase-chip b{ color:var(--accent); }
.top-actions{ display:flex; gap:12px; }
.iconbtn{ width:66px; height:66px; border-radius:17px; background:var(--surface); border:3px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:33px; color:var(--ink); box-shadow:4px 4px 0 var(--line); }
.iconbtn:active{ transform:translate(4px,4px); box-shadow:none; }

.players-mini{ display:flex; justify-content:space-between; gap:14px; margin-top:18px; font-size:31px; }
.pmini{ display:flex; align-items:baseline; gap:5px; font-weight:700; font-family:var(--font-mono); }
.pmini.p1{ color:var(--p1); } .pmini.p2{ color:var(--p2); }
.pmini .sub{ color:var(--ink-faint); font-weight:600; }

/* ---- groups bar: all 15 group filters as one genuine honeycomb, ordered
   small-seat to large-seat (see design/plan.md "State-groups rebalance")
   rather than boxed into 3 separate labeled tiers — the ordering itself
   communicates size, no dividers needed. Capped at 2 rows: 8 on top / 7 on
   bottom, both centered independently — since 8 vs 7 differ by exactly one
   hex+gap pitch, centering each row on the same width alone produces the
   correct half-pitch horizontal offset for interlocking, no manual
   left-shift needed. The bottom row is then pulled up to nest into the top
   row's gaps. Hex size is solved from the actual available width for the
   *denser* (8-wide) row — not a grid 1fr stretch, which is what caused the
   sizing bugs earlier in this file's history. ---- */
.groups-bar{ --hexgap:4px; --hexw:calc((100vw - 12px - 7 * var(--hexgap)) / 8);
  flex:0 0 auto; display:flex; flex-direction:column; padding:9px 6px 13px; background:var(--surface); border-bottom:3px solid var(--line); }
.hex-row{ display:flex; justify-content:center; gap:var(--hexgap); }
.hex-row.row-b{ margin-top:calc(var(--hexw) * -0.26); }
.gchip{ position:relative; width:var(--hexw); aspect-ratio:1; background:none; }
.gchip .hex{ width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--hexw) * 0.72); line-height:1; background:var(--surface2);
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  filter:drop-shadow(2px 2px 0 var(--line)); }
.gchip.on .hex{ background:var(--accent); color:#fff; }
.gchip .badge{ display:none; position:absolute; top:-3px; right:2px; width:13px; height:13px; border-radius:50%; background:var(--stamp); border:2px solid var(--surface); z-index:1; }
.gchip.qualified .badge{ display:block; }

.group-readout{ flex:0 0 auto; background:var(--surface2); padding:11px 16px; border-bottom:3px solid var(--line); font-size:25px; color:var(--ink-soft); line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.group-readout[hidden]{ display:none; }
.group-readout b{ color:var(--ink); }

/* ---- map: the "table" the ballot sits on, pale and flat. Lakshadweep and
   A&N are dropped entirely — including a leftover red debug bounding box
   baked into the source SVG around Lakshadweep, unrelated to the island
   shape itself. Union Territories are handled as a single button instead.
   All corner controls live INSIDE map-wrap so their position is relative
   to the map's own box, never to the full viewport. ---- */
.map-wrap{ flex:1 1 auto; position:relative; min-height:0; overflow:hidden; background:
  repeating-linear-gradient(0deg, rgba(20,22,28,.025) 0px, rgba(20,22,28,.025) 1px, transparent 1px, transparent 26px),
  var(--page); }
.india-map{ position:absolute; inset:0; width:100%; height:100%; transform:scale(1.1); transform-origin:center; }
.india-map path{ fill:var(--map-base); stroke:var(--map-stroke); stroke-width:1.1; cursor:pointer; transition:opacity .25s ease, fill .2s ease; }
.india-map path.selected{ stroke:var(--accent); stroke-width:3; stroke-dasharray:5 3; animation:march .7s linear infinite; }
@keyframes march{ to{ stroke-dashoffset:-8; } }
.india-map path#INLD, .india-map path#INAN, .india-map rect#bbox-lakshadweep{ display:none; }

/* ---- bottom corners: a single UTs button (left) and rally/special action
   buttons (right, where Andaman & Nicobar used to sit). Positioned inside
   map-wrap, so they sit a fixed distance above the map's own bottom edge —
   never dependent on the info panel below, which never changes size. ---- */
.corner-left, .corner-right{ position:absolute; bottom:27px; z-index:7; }
.corner-left{ left:27px; display:flex; flex-direction:column; gap:14px; }
.corner-right{ right:27px; display:flex; flex-direction:row; align-items:flex-end; gap:14px; }
.fab-stack{ position:relative; }

.uts-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; width:138px; height:123px; border-radius:27px; background:var(--surface); border:3px solid var(--line); box-shadow:6px 6px 0 var(--line); font-size:55px; }
.uts-btn .lb{ font-size:23px; font-weight:800; letter-spacing:.02em; color:var(--ink-soft); }
.uts-btn:active{ transform:translate(6px,6px); box-shadow:none; }

.fab{ position:relative; width:123px; height:123px; border-radius:27px;
  background:var(--surface); border:3px solid var(--line); box-shadow:6px 6px 0 var(--line);
  display:flex; align-items:center; justify-content:center; font-size:59px;
  transition:transform .12s ease, box-shadow .12s ease; }
.fab.armed{ background:var(--accent); border-color:var(--accent); color:#fff; }
.fab.depleted{ opacity:.4; }
.fab:active{ transform:translate(6px,6px); box-shadow:none; }
.fab .badge{ position:absolute; top:-13px; right:-13px; min-width:39px; height:39px; padding:0 8px; border-radius:20px; background:var(--ink); color:var(--page); font-family:var(--font-mono); font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.fab .dot{ position:absolute; top:-4px; left:-4px; width:22px; height:22px; border-radius:50%; background:var(--stamp); border:3px solid var(--page); display:none; }
.fab .dot.show{ display:block; }

/* ---- token tray: the FAB is the single always-visible entry point; tapping
   it expands a stack of token rows above it. Anchored to corner-right's
   bottom edge so the toggle button never moves when the tray opens. ---- */
.token-tray{ position:absolute; right:0; bottom:calc(100% + 15px); display:flex; flex-direction:column; gap:12px;
  max-height:0; opacity:0; overflow:hidden; pointer-events:none;
  transition:max-height .22s ease, opacity .18s ease; }
.token-tray.open{ max-height:420px; opacity:1; pointer-events:auto; }
.tray-item{ display:flex; align-items:center; gap:14px; width:294px; padding:14px 20px; border-radius:20px;
  background:var(--surface); border:3px solid var(--line); box-shadow:5px 5px 0 var(--line);
  transition:transform .1s ease, box-shadow .1s ease; }
.tray-item:active{ transform:translate(5px,5px); box-shadow:none; }
.tray-item .ti-icon{ font-size:36px; width:42px; text-align:center; flex:0 0 auto; }
.tray-item .ti-label{ flex:1 1 auto; text-align:left; font-family:var(--font-mono); font-size:22px; font-weight:700; letter-spacing:.01em; color:var(--ink); }
.tray-item .ti-badge{ font-family:var(--font-mono); font-size:20px; font-weight:800; padding:5px 11px; border-radius:12px; background:var(--ink); color:var(--page); min-width:48px; text-align:center; flex:0 0 auto; }
.tray-item.armed{ background:var(--accent); border-color:var(--accent); }
.tray-item.armed .ti-label{ color:#fff; }
.tray-item.depleted, .tray-item.locked{ opacity:.5; }
.tray-item.locked .ti-badge{ background:var(--ink-faint); }
.tray-item.craftable{ animation:craft-pulse 1.4s ease-in-out infinite; }
.tray-item.craftable .ti-badge{ background:var(--stamp); }
.tray-item.used{ opacity:.35; }
.tray-item.used .ti-badge{ background:var(--ink-faint); }
@keyframes craft-pulse{
  0%,100%{ box-shadow:5px 5px 0 var(--line); }
  50%{ box-shadow:5px 5px 0 var(--line), 0 0 0 5px rgba(179,49,29,.35); }
}

/* ---- agenda tray: same tray-item shell, but each row tracks continuous
   0-100% commitment progress instead of a token count, so it gets a fill
   bar under the label instead of just a badge number. ---- */
.tray-item .ti-col{ flex:1 1 auto; display:flex; flex-direction:column; gap:6px; min-width:0; }
.tray-item .ti-progress-track{ height:8px; border-radius:5px; background:var(--track); overflow:hidden; }
.tray-item .ti-progress-fill{ height:100%; background:var(--accent); border-radius:5px; transition:width .25s ease; }
.tray-item.agenda-done .ti-progress-fill{ background:var(--stamp); }
.tray-item.agenda-done{ opacity:.55; }

/* ---- news ticker: a chyron in normal document flow at the very top of the
   stage (breaking news, then state groups, then the group info readout),
   echoing the same events that already fire showToast (rallies, crafts,
   phase turns) as a scrolling wire-service feed instead of a one-off popup. ---- */
.news-ticker{ flex:0 0 auto; height:58px; background:var(--ink); display:flex; align-items:stretch; box-shadow:0 3px 0 var(--stamp); }
.news-ticker .tag{ flex:0 0 auto; display:flex; align-items:center; padding:0 18px; background:var(--stamp); color:#fff; font-family:var(--font-mono); font-size:24px; font-weight:800; letter-spacing:.05em; }
.news-ticker .feed{ flex:1 1 auto; overflow:hidden; white-space:nowrap; }
.news-ticker .feed .track{ display:inline-flex; align-items:center; height:58px; gap:48px; padding-left:48px; animation:ticker-scroll 22s linear infinite; }
.news-ticker .feed .track span{ font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--page); }
@keyframes ticker-scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

.toast{ position:absolute; left:50%; top:21px; transform:translate(-50%,0); z-index:9; background:var(--ink); color:var(--page); font-size:30px; font-weight:700; padding:18px 33px; border-radius:15px; box-shadow:4px 4px 0 var(--accent); opacity:0; pointer-events:none; transition:opacity .25s ease; }
.toast.show{ opacity:1; }

/* ---- info panel: fixed, non-interactive readout for the tapped state, kept
   as small as the content allows. One line for name+seats, one compact row
   of icon-only group chips, one single tug-of-war bar for both players.
   Doesn't expand, doesn't drag, doesn't cover the map. Investing still
   happens by tapping the map directly. ---- */
.info-panel{ flex:0 0 auto; padding:27px 27px calc(env(safe-area-inset-bottom,0px) + 27px); background:var(--surface); border-top:3px solid var(--line); }
.info-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.info-row h3{ margin:0; font-size:45px; font-weight:800; letter-spacing:-.01em; }
.info-row .seats{ font-family:var(--font-mono); font-size:28px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }

.info-groups{ display:flex; flex-wrap:wrap; gap:10px; margin-left:auto; }
.info-groups .chip{ width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:31px; background:var(--surface2); border-radius:11px; }
.info-groups .none{ font-size:24px; color:var(--ink-faint); line-height:48px; }

.vs-bar{ display:flex; align-items:center; gap:16px; margin-top:21px; }
.vs-label{ font-family:var(--font-mono); font-size:31px; font-weight:800; white-space:nowrap; }
.vs-label.p1{ color:var(--p1); } .vs-label.p2{ color:var(--p2); }
.vs-track{ flex:1 1 auto; display:flex; height:27px; border:3px solid var(--line); border-radius:9px; overflow:hidden; background:var(--track); }
.vs-seg.p1{ background:var(--p1); } .vs-seg.p2{ background:var(--p2); } .vs-seg.oth{ background:transparent; }
</style>

      <div class="phase-chip">PHASE <b>1/8</b> &nbsp;&middot;&nbsp; 02:45</div>

    </div>

  <div class="news-ticker">

    <div class="feed"><div class="track" id="newsTrack"></div></div>
  </div>

  <div class="groups-bar" id="groupsBox"></div>
  <div class="group-readout" id="groupReadout" hidden></div>

tionalParksWildlife"]},{"name":"Kerala","seats":20,"svgId":"INKL","groups":["CoastalIndia","SouthIndia","Education","TravelAndTourism","NaturalResources","MinorityAreas"]},{"name":"Ladakh","seats":1,"svgId":"INLA","groups":["TravelAndTourism","WesternBorder"]},{"name":"Lakshadweep","seats":1,"svgId":"INLD","groups":["CoastalIndia","TravelAndTourism","MinorityAreas"]},{"name":"Madhya Pradesh","seats":29,"svgId":"INMP","groups":["HindiHeartland","AgriculturalRegion","IndustrialCorridor","TribalLands","NaturalResources","NationalParksWildlife"]},{"name":"Maharashtra","seats":48,"svgId":"INMH","groups":["CoastalIndia","AgriculturalRegion","IndustrialCorridor","Manufacturing","Education"]},{"name":"Manipur","seats":2,"svgId":"INMN","groups":["TribalLands","MinorityAreas","EasternBorder"]},{"name":"Meghalaya","seats":2,"svgId":"INML","groups":["TribalLands","MinorityAreas","EasternBorder"]},{"name":"Mizoram","seats":1,"svgId":"INMZ","groups":["TribalLands","MinorityAreas","EasternBorder"]},{"name":"Nagaland","seats":1,"svgId":"INNL","groups":["TribalLands","MinorityAreas","EasternBorder"]},{"name":"Odisha","seats":21,"svgId":"INOR","groups":["CoastalIndia","Pilgrimage","TribalLands","NaturalResources","NationalParksWildlife"]},{"name":"Puducherry","seats":1,"svgId":"INPY","groups":["CoastalIndia","SouthIndia","TravelAndTourism"]},{"name":"Punjab","seats":13,"svgId":"INPB","groups":["AgriculturalRegion","Pilgrimage","MinorityAreas","WesternBorder"]},{"name":"Rajasthan","seats":25,"svgId":"INRJ","groups":["HindiHeartland","IndustrialCorridor","TravelAndTourism","NationalParksWildlife","WesternBorder"]},{"name":"Sikkim","seats":1,"svgId":"INSK","groups":["TravelAndTourism","MinorityAreas","EasternBorder"]},{"name":"Tamil Nadu","seats":39,"svgId":"INTN","groups":["CoastalIndia","SouthIndia","Pilgrimage","Manufacturing","Education","TravelAndTourism"]},{"name":"Telangana","seats":17,"svgId":"INTG","groups":["SouthIndia","Manufacturing","Education","NaturalResources"]},{"name":"Tripura","seats":2,"svgId":"INTR","groups":["TribalLands","EasternBorder"]},{"name":"Uttar Pradesh","seats":80,"svgId":"INUP","groups":["HindiHeartland","AgriculturalRegion","Pilgrimage","IndustrialCorridor","TravelAndTourism","EasternBorder"]},{"name":"Uttarakhand","seats":5,"svgId":"INUT","groups":["HindiHeartland","Pilgrimage","TravelAndTourism","NationalParksWildlife","EasternBorder"]},{"name":"West Bengal","seats":42,"svgId":"INWB","groups":["CoastalIndia","Manufacturing","Education","NaturalResources","MinorityAreas","EasternBorder"]}];
// Tiered per design/plan.md's "State-groups rebalance" — 5 groups per tier,
// ordered by seat count within each tier (see that section for the full
// seat-total table and the reasoning behind every add/drop/split).
// Ordered ascending by seat count (smallest group first) rather than boxed
// by tier — see design/plan.md "State-groups rebalance" for the full table.
const GROUPS = [
  {key:'WesternBorder', icon:'🏔️', label:'Western Border', seats:74},
  {key:'TribalLands', icon:'🌳', label:'Tribal Lands', seats:86},
  {key:'MinorityAreas', icon:'🕌', label:'Minority Areas', seats:107},
  {key:'NationalParksWildlife', icon:'🐅', label:'National Parks & Wildlife', seats:122},
  {key:'SouthIndia', icon:'🌴', label:'South India', seats:130},
  {key:'EasternBorder', icon:'🌄', label:'Eastern Border', seats:192},
  {key:'TravelAndTourism', icon:'✈️', label:'Travel & Tourism', seats:194},
  {key:'Education', icon:'🎓', label:'Education', seats:202},
  {key:'Manufacturing', icon:'⚙️', label:'Manufacturing', seats:210},
  {key:'NaturalResources', icon:'⛏️', label:'Natural Resources', seats:219},
  {key:'HindiHeartland', icon:'🕉️', label:'Hindi Heartland', seats:226},
  {key:'IndustrialCorridor', icon:'🏭', label:'Industrial Corridor', seats:239},
  {key:'Pilgrimage', icon:'🙏', label:'Pilgrimage', seats:254},
  {key:'CoastalIndia', icon:'🌊', label:'Coastal India', seats:256},
  {key:'AgriculturalRegion', icon:'🌾', label:'Agricultural Region', seats:273},
];
const SMALL_UTS = ['INDL','INCH','INDH','INPY','INLD','INAN'];
const COLORS = { p1:'#E8871C', p2:'#1C8A4B', others:'#E4E7EC' };

let pop = {}, selectedId = 'INUP', activeGroup = null, armedToken = null;
// Reworked 3-flavor token economy: stateRally is the only earned resource
// (2/phase, accumulates, no more use-it-or-lose-it). Special Powerup and
// Nationwide Rally are crafted by converting banked stateRally tokens, then
// each usable exactly once per game — see design/plan.md "Unlock mechanism".
const CRAFT_COST = { special:6, nationwide:12 };
const tokenCounts = { stateRally:5 };
const crafted = { special:false, nationwide:false };
const used = { special:false, nationwide:false };
let trayOpen = false;

// Politician-driven agendas — see design/plan.md "The 20-politician roster".
// Modi's signature 4 for this mockup; each is committed to independently
// (not contested), +25% per tap, completion pays a flavor popularity bump
// and counts as a breaking-news moment same as a rally/special power.
const AGENDAS = ['Infrastructure','Hindutva','EconomicLiberalization','NationalDefense'];
const agendaProgress = { Infrastructure:0, Hindutva:0, EconomicLiberalization:0, NationalDefense:0 };
let agendaTrayOpen = false;
let phase = 1;

function seed(){
  const ids = STATES.map(s=>s.svgId).slice();
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const p1Lead = new Set(ids.slice(0,5)), p2Lead = new Set(ids.slice(5,10));
  STATES.forEach(s=>{
    let p1,p2;
    if(p1Lead.has(s.svgId)){ p1=35+Math.random()*20; p2=8+Math.random()*12; }
    else if(p2Lead.has(s.svgId)){ p2=35+Math.random()*20; p1=8+Math.random()*12; }
    else { p1=5+Math.random()*12; p2=5+Math.random()*12; }
    pop[s.svgId] = {p1, p2, others: Math.max(0,100-p1-p2)};
  });
}
function fmtPct(n){ return Math.round(n)+'%'; }
function leaderColor(id){ const p=pop[id]; if(!p) return COLORS.others;
  if(p.p1>=p.p2 && p.p1>=p.others) return COLORS.p1;
  if(p.p2>=p.p1 && p.p2>=p.others) return COLORS.p2;
  return COLORS.others; }
function paintMap(){ document.querySelectorAll('.india-map path[id]').forEach(p=>{ p.style.fill = leaderColor(p.id); }); }

function updateCard(){
  const s = STATES.find(s=>s.svgId===selectedId); const p = pop[selectedId];
  if(!s||!p) return;
  document.getElementById('cardName').textContent = s.name;
  document.getElementById('cardSeats').textContent = s.seats + ' seats';
  document.getElementById('cardP1Fill').style.width = p.p1+'%';
  document.getElementById('cardOthFill').style.width = p.others+'%';
  document.getElementById('cardP2Fill').style.width = p.p2+'%';
  document.getElementById('cardP1Pct').textContent = fmtPct(p.p1);
  document.getElementById('cardP2Pct').textContent = fmtPct(p.p2);
  const groupsEl = document.getElementById('cardGroups');
  groupsEl.innerHTML = '';
  if(!s.groups.length){
    groupsEl.innerHTML = '<span class="none">No group affiliations</span>';
  } else {
    s.groups.forEach(key=>{
      const g = GROUPS.find(x=>x.key===key); if(!g) return;
      const chip = document.createElement('span');
      chip.className = 'chip'; chip.title = g.label;
      chip.textContent = g.icon;
      groupsEl.appendChild(chip);
    });
  }
}

function updateSeatProjection(){
  let p1s=0,p2s=0; const total=543;
  STATES.forEach(s=>{ const p=pop[s.svgId]; p1s += s.seats*p.p1/100; p2s += s.seats*p.p2/100; });
  const oths = total-p1s-p2s;
  document.getElementById('segP1').style.width = (p1s/total*100)+'%';
  document.getElementById('segOth').style.width = (oths/total*100)+'%';
  document.getElementById('segP2').style.width = (p2s/total*100)+'%';
  document.getElementById('p1Seats').textContent = Math.round(p1s)+' seats';
  document.getElementById('p2Seats').textContent = Math.round(p2s)+' seats';
}

function selectState(id){
  document.querySelectorAll('.india-map path.selected').forEach(p=>p.classList.remove('selected'));
  const el = document.getElementById(id); if(el) el.classList.add('selected');
  selectedId = id; updateCard();
}

function investIn(id, mult){
  const p = pop[id]; if(!p) return;
  const take = Math.min(4*mult, p.others);
  p.others -= take; p.p1 += take;
  if(p.others < 0.5 && p.p1 < 92){ const from = Math.min(2*mult, p.p2); p.p2 -= from; p.p1 += from; }
  paintMap(); updateCard(); updateSeatProjection(); if(activeGroup) applyGroupHighlight();
  const el = document.getElementById(id);
  if(el && el.animate){ el.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:220}); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

// Breaking-news ticker: only the game-changing moments — a State Rally
// landing, a Special Powerup or Nationwide Rally going off — get a headline.
// Arming prompts, craft confirmations, UT taps, and phase turns stay
// toast-only; pushNews() is called explicitly at those three sites, not
// hooked into every showToast.
const newsFeed = [];
function pushNews(msg){
  newsFeed.unshift(msg);
  if(newsFeed.length>6) newsFeed.pop();
  renderNews();
}
function renderNews(){
  const items = newsFeed.length ? newsFeed : ['Welcome to Booth Ink — the campaign trail begins.'];
  const html = items.map(m=>`<span>${m}</span>`).join('<span aria-hidden="true">&nbsp;&nbsp;•&nbsp;&nbsp;</span>');
  document.getElementById('newsTrack').innerHTML = html + '<span aria-hidden="true">&nbsp;&nbsp;•&nbsp;&nbsp;</span>' + html;
}

document.getElementById('map').addEventListener('click', e=>{
  const path = e.target.closest('path[id]'); if(!path) return;
  selectState(path.id);
  if(armedToken==='stateRally'){
    investIn(path.id, 2);
    tokenCounts.stateRally--;
    showToast('📢 State Rally deployed');
    pushNews(`📢 BREAKING: State Rally held in ${STATES.find(s=>s.svgId===path.id).name}`);
    armedToken=null; renderTokens();
  } else investIn(path.id, 1);
});

document.getElementById('utsBtn').addEventListener('click', ()=>{
  SMALL_UTS.forEach(id => investIn(id, 1));
  showToast('Invested in all Union Territories');
});

document.getElementById('goaBtn').addEventListener('click', ()=>{
  selectState('INGA');
  investIn('INGA', 1);
  showToast('Invested in Goa');
});

function applyGroupHighlight(){
  const members = !activeGroup ? null : STATES.filter(s=>s.groups.includes(activeGroup)).map(s=>s.svgId);
  document.querySelectorAll('.india-map path[id]').forEach(p=>{ p.style.opacity = (!members || members.includes(p.id)) ? '1' : '0.15'; });
  document.querySelectorAll('.gchip').forEach(c=>c.classList.remove('qualified'));
  const readout = document.getElementById('groupReadout');
  if(!members){ readout.hidden = true; return; }
  const set = STATES.filter(s=>members.includes(s.svgId));
  const seats = set.reduce((a,s)=>a+s.seats,0);
  const qualifying = set.filter(s=>pop[s.svgId].p1>50).length;
  const gdef = GROUPS.find(g=>g.key===activeGroup);
  const qualified = qualifying===set.length;
  if(qualified){ const chip = document.querySelector(`.gchip[data-key="${activeGroup}"]`); if(chip) chip.classList.add('qualified'); }
  readout.hidden = false;
  readout.innerHTML = `<b>${gdef.icon} ${gdef.label}</b> &middot; ${seats} seats &middot; leading ${qualifying}/${set.length}${qualified?' — bonus qualified!':''}`;
}

function buildGroupsBox(){
  const box = document.getElementById('groupsBox');
  // 8 on top, 7 on bottom — 15 split as evenly as possible across 2 rows.
  const rows = [GROUPS.slice(0, 8), GROUPS.slice(8)];
  rows.forEach((rowMembers, i)=>{
    const row = document.createElement('div');
    row.className = `hex-row ${i===0?'row-a':'row-b'}`;
    rowMembers.forEach(g=>{
      const b = document.createElement('button');
      b.className='gchip'; b.dataset.key=g.key; b.title=`${g.label} — ${g.seats} seats`;
      b.innerHTML = `<span class="hex">${g.icon}</span><span class="badge"></span>`;
      b.addEventListener('click', ()=>{
        activeGroup = (activeGroup===g.key) ? null : g.key;
        document.querySelectorAll('.gchip').forEach(x=>x.classList.toggle('on', x.dataset.key===activeGroup));
        applyGroupHighlight();
      });
      row.appendChild(b);
    });
    box.appendChild(row);
  });
}

function craftSlotState(flavor){
  if(used[flavor]) return 'used';
  if(crafted[flavor]) return 'ready';
  if(tokenCounts.stateRally >= CRAFT_COST[flavor]) return 'craftable';
  return 'locked';
}

function setTray(open){
  trayOpen = open;
  document.getElementById('tokenTray').classList.toggle('open', trayOpen);
  if(open) setAgendaTray(false);
}

function setAgendaTray(open){
  agendaTrayOpen = open;
  document.getElementById('agendaTray').classList.toggle('open', agendaTrayOpen);
  if(open) setTray(false);
}

function renderAgendas(){
  let doneCount = 0;
  AGENDAS.forEach(name=>{
    const pct = agendaProgress[name];
    const done = pct>=100;
    if(done) doneCount++;
    document.getElementById(`agenda${name}Fill`).style.width = pct+'%';
    document.getElementById(`agenda${name}Badge`).textContent = done ? '✓' : pct+'%';
    document.getElementById(`agenda${name}`).classList.toggle('agenda-done', done);
  });
  document.getElementById('agendaToggleBadge').textContent = AGENDAS.length - doneCount;
  document.getElementById('agendaToggleDot').classList.toggle('show', doneCount>0 && doneCount<AGENDAS.length);
}

function investAgenda(name){
  if(agendaProgress[name]>=100) return;
  agendaProgress[name] = Math.min(100, agendaProgress[name]+25);
  if(agendaProgress[name]>=100){
    showToast(`${name} agenda completed`);
    pushNews(`📜 BREAKING: ${name.replace(/([A-Z])/g,' $1').trim()} agenda fully committed`);
    investIn(selectedId, 3);
  } else {
    showToast(`Invested in ${name}`);
  }
  renderAgendas();
}

function renderTokens(){
  document.getElementById('rallyBadge').textContent = tokenCounts.stateRally;
  document.getElementById('rallyBtn').classList.toggle('depleted', tokenCounts.stateRally<=0);
  document.getElementById('rallyBtn').classList.toggle('armed', armedToken==='stateRally');

  let readyCount = 0;
  [['special','specialBtn','specialBadge','⭐'], ['nationwide','nationwideBtn','nationwideBadge','🇮🇳']]
  .forEach(([flavor, btnId, badgeId])=>{
    const state = craftSlotState(flavor);
    const btn = document.getElementById(btnId), badge = document.getElementById(badgeId);
    btn.classList.remove('locked','craftable','used','armed');
    if(state==='locked'){ btn.classList.add('locked'); badge.textContent = `${tokenCounts.stateRally}/${CRAFT_COST[flavor]}`; }
    else if(state==='craftable'){ btn.classList.add('craftable'); badge.textContent = `${tokenCounts.stateRally}/${CRAFT_COST[flavor]}`; readyCount++; }
    else if(state==='ready'){ btn.classList.toggle('armed', armedToken===flavor); badge.textContent = 'READY'; readyCount++; }
    else { btn.classList.add('used'); badge.textContent = '✓'; }
  });

  // toggle FAB mirrors the tray's headline number (banked State Rally) and
  // flags a red dot when something inside is worth opening the tray for.
  document.getElementById('tokenToggleBadge').textContent = tokenCounts.stateRally;
  document.getElementById('tokenToggleDot').classList.toggle('show', readyCount>0);
  document.getElementById('tokenToggleBtn').classList.toggle('armed', !!armedToken);
}

function armToken(type){
  if(type==='stateRally'){
    if(tokenCounts.stateRally<=0) return;
    armedToken = (armedToken===type) ? null : type;
    renderTokens();
    setTray(false);
    if(armedToken) showToast('Tap a state to deploy');
    return;
  }
  // special / nationwide: craft on first tap once affordable, use on the next tap.
  const state = craftSlotState(type);
  if(state==='locked'){ showToast(`Need ${CRAFT_COST[type]} State Rally tokens (have ${tokenCounts.stateRally})`); return; }
  if(state==='used') return;
  if(state==='craftable'){
    tokenCounts.stateRally -= CRAFT_COST[type];
    crafted[type] = true;
    armedToken = null;
    renderTokens();
    showToast(type==='special' ? '⭐ Special Powerup crafted — tap to activate' : '🇮🇳 Nationwide Rally crafted — tap to activate');
    return;
  }
  // ready: activate immediately — both effects resolve instantly, no map tap needed.
  used[type] = true;
  armedToken = null;
  if(type==='nationwide'){
    STATES.forEach(s=> investIn(s.svgId, 3));
    showToast('🇮🇳 Nationwide Rally activated');
    pushNews('🇮🇳 BREAKING: Nationwide Rally launched — every state feels it');
  } else {
    investIn(selectedId, 6);
    showToast('⭐ Special Power activated');
    pushNews('⭐ BREAKING: Special Power invoked');
  }
  renderTokens();
  setTray(false);
}
document.getElementById('rallyBtn').addEventListener('click', ()=> armToken('stateRally'));
document.getElementById('specialBtn').addEventListener('click', ()=> armToken('special'));
document.getElementById('nationwideBtn').addEventListener('click', ()=> armToken('nationwide'));
document.getElementById('tokenToggleBtn').addEventListener('click', ()=> setTray(!trayOpen));

AGENDAS.forEach(name=> document.getElementById(`agenda${name}`).addEventListener('click', ()=> investAgenda(name)));
document.getElementById('agendaToggleBtn').addEventListener('click', ()=> setAgendaTray(!agendaTrayOpen));

document.getElementById('resetBtn').title = 'Next phase (demo): +2 State Rally';
document.getElementById('resetBtn').addEventListener('click', ()=>{
  seed(); paintMap(); updateCard(); updateSeatProjection(); applyGroupHighlight();
  phase = Math.min(8, phase+1);
  document.querySelector('.phase-chip b').textContent = `${phase}/8`;
  tokenCounts.stateRally += 2;
  armedToken=null; renderTokens();
  showToast(`Phase ${phase} — +2 State Rally`);
});

seed(); buildGroupsBox(); renderTokens(); renderAgendas(); paintMap(); renderNews();
selectState('INUP'); updateSeatProjection();
</script>
