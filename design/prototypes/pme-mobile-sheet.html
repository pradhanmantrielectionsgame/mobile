<title>Pradhan Mantri — Booth Ink</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PME Booth">
<meta name="theme-color" content="#EEF0F3">
<style>
:root{
  --page:#EEF0F3; --surface:#FFFFFF; --surface2:#F7F8FA; --track:#E4E7EC;
  --ink:#14161C; --ink-soft:#4B5160; --ink-faint:#8890A0;
  --line:#14161C; --rule:#D8DCE3;
  --accent:#2451D6; --accent-ink:#FFFFFF;
  --stamp:#B3311D;
  --p1:#E8871C; --p2:#1C8A4B; --map-base:#E4E7EC; --map-stroke:#14161C;
  --font: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overscroll-behavior:none;}
body{ font-family:var(--font); background:var(--page); color:var(--ink); }
button{ font-family:inherit; border:none; background:none; color:inherit; }
@media (prefers-reduced-motion: reduce){ *{ transition-duration:.01ms !important; animation-duration:.01ms !important; } }

/* Three fixed regions stacked in a column — header, map, info panel. Nothing
   overlaps, nothing expands, so no element's position ever depends on
   another's runtime size. */
.stage{ position:fixed; inset:0; overflow:hidden; display:flex; flex-direction:column; }

/* ---- topstrip: ballot-header band. Seat bar + phase, then a slim players
   readout — small, glanceable. ---- */
.topstrip{ flex:0 0 auto; padding:calc(env(safe-area-inset-top,0px) + 15px) 27px 21px; background:var(--surface); border-bottom:3px solid var(--line); }
.seatbar{ display:flex; height:15px; border:3px solid var(--line); border-radius:6px; overflow:hidden; background:var(--track); margin-bottom:18px; }
.seatbar .seg.p1{ background:var(--p1); } .seatbar .seg.p2{ background:var(--p2); } .seatbar .seg.oth{ background:transparent; }
.topstrip-row{ display:flex; align-items:center; justify-content:space-between; }
.phase-chip{ font-family:var(--font-mono); font-size:35px; font-weight:700; color:var(--ink-soft); letter-spacing:.01em; }
.phase-chip b{ color:var(--accent); }
.top-actions{ display:flex; gap:12px; }
.iconbtn{ width:66px; height:66px; border-radius:17px; background:var(--surface); border:3px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:33px; color:var(--ink); box-shadow:4px 4px 0 var(--line); }
.iconbtn:active{ transform:translate(4px,4px); box-shadow:none; }

.players-mini{ display:flex; justify-content:space-between; gap:14px; margin-top:18px; font-size:31px; }
.pmini{ display:flex; align-items:baseline; gap:5px; font-weight:700; font-family:var(--font-mono); }
.pmini.p1{ color:var(--p1); } .pmini.p2{ color:var(--p2); }
.pmini .sub{ color:var(--ink-faint); font-weight:600; }

/* ---- groups bar: all 16 group filters, pinned full-width under the header.
   Normal document flow, not a floating overlay — its width is exactly the
   screen width by construction, so there's no shrink-to-fit ambiguity and
   nothing can overflow or get squeezed unpredictably on any phone size. ---- */
.groups-bar{ flex:0 0 auto; display:grid; grid-template-columns:repeat(8,1fr); gap:10px; padding:8px 16px; background:var(--surface); border-bottom:3px solid var(--line); }
.gchip{ position:relative; aspect-ratio:1; padding:3px; display:flex; align-items:center; justify-content:center; font-size:clamp(21px, 9vw, 36px); line-height:1; border-radius:11px; background:none; }
.gchip.on{ background:var(--accent); }
.gchip .badge{ display:none; position:absolute; top:0; right:0; width:14px; height:14px; border-radius:50%; background:var(--stamp); border:2px solid var(--surface); }
.gchip.qualified .badge{ display:block; }

.group-readout{ flex:0 0 auto; background:var(--surface2); padding:10px 16px; border-bottom:3px solid var(--line); font-size:19px; color:var(--ink-soft); line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.group-readout[hidden]{ display:none; }
.group-readout b{ color:var(--ink); }

/* ---- map: the "table" the ballot sits on, pale and flat. Lakshadweep and
   A&N are dropped entirely — including a leftover red debug bounding box
   baked into the source SVG around Lakshadweep, unrelated to the island
   shape itself. Union Territories are handled as a single button instead.
   All corner controls live INSIDE map-wrap so their position is relative
   to the map's own box, never to the full viewport. ---- */
.map-wrap{ flex:1 1 auto; position:relative; min-height:0; overflow:hidden; background:
  repeating-linear-gradient(0deg, rgba(20,22,28,.025) 0px, rgba(20,22,28,.025) 1px, transparent 1px, transparent 26px),
  var(--page); }
.india-map{ position:absolute; inset:0; width:100%; height:100%; }
.india-map path{ fill:var(--map-base); stroke:var(--map-stroke); stroke-width:1.1; cursor:pointer; transition:opacity .25s ease, fill .2s ease; }
.india-map path.selected{ stroke:var(--accent); stroke-width:3; stroke-dasharray:5 3; animation:march .7s linear infinite; }
@keyframes march{ to{ stroke-dashoffset:-8; } }
.india-map path#INLD, .india-map path#INAN, .india-map rect#bbox-lakshadweep{ display:none; }

/* ---- bottom corners: a single UTs button (left) and rally/special action
   buttons (right, where Andaman & Nicobar used to sit). Positioned inside
   map-wrap, so they sit a fixed distance above the map's own bottom edge —
   never dependent on the info panel below, which never changes size. ---- */
.corner-left, .corner-right{ position:absolute; bottom:27px; z-index:7; }
.corner-left{ left:27px; }
.corner-right{ right:27px; display:flex; flex-direction:column; gap:21px; }

.uts-btn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; width:138px; height:123px; border-radius:27px; background:var(--surface); border:3px solid var(--line); box-shadow:6px 6px 0 var(--line); font-size:55px; }
.uts-btn .lb{ font-size:23px; font-weight:800; letter-spacing:.02em; color:var(--ink-soft); }
.uts-btn:active{ transform:translate(6px,6px); box-shadow:none; }

.fab{ position:relative; width:123px; height:123px; border-radius:27px;
  background:var(--surface); border:3px solid var(--line); box-shadow:6px 6px 0 var(--line);
  display:flex; align-items:center; justify-content:center; font-size:59px;
  transition:transform .12s ease, box-shadow .12s ease; }
.fab.armed{ background:var(--accent); border-color:var(--accent); color:#fff; }
.fab.depleted{ opacity:.4; }
.fab:active{ transform:translate(6px,6px); box-shadow:none; }
.fab .badge{ position:absolute; top:-13px; right:-13px; min-width:39px; height:39px; padding:0 8px; border-radius:20px; background:var(--ink); color:var(--page); font-family:var(--font-mono); font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center; }

.toast{ position:absolute; left:50%; top:21px; transform:translate(-50%,0); z-index:9; background:var(--ink); color:var(--page); font-size:30px; font-weight:700; padding:18px 33px; border-radius:15px; box-shadow:4px 4px 0 var(--accent); opacity:0; pointer-events:none; transition:opacity .25s ease; }
.toast.show{ opacity:1; }

/* ---- info panel: fixed, non-interactive readout for the tapped state, kept
   as small as the content allows. One line for name+seats, one compact row
   of icon-only group chips, one single tug-of-war bar for both players.
   Doesn't expand, doesn't drag, doesn't cover the map. Investing still
   happens by tapping the map directly. ---- */
.info-panel{ flex:0 0 auto; padding:27px 27px calc(env(safe-area-inset-bottom,0px) + 27px); background:var(--surface); border-top:3px solid var(--line); }
.info-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.info-row h3{ margin:0; font-size:45px; font-weight:800; letter-spacing:-.01em; }
.info-row .seats{ font-family:var(--font-mono); font-size:28px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }

.info-groups{ display:flex; flex-wrap:wrap; gap:10px; margin-left:auto; }
.info-groups .chip{ width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:31px; background:var(--surface2); border-radius:11px; }
.info-groups .none{ font-size:24px; color:var(--ink-faint); line-height:48px; }

.vs-bar{ display:flex; align-items:center; gap:16px; margin-top:21px; }
.vs-label{ font-family:var(--font-mono); font-size:31px; font-weight:800; white-space:nowrap; }
.vs-label.p1{ color:var(--p1); } .vs-label.p2{ color:var(--p2); }
.vs-track{ flex:1 1 auto; display:flex; height:27px; border:3px solid var(--line); border-radius:9px; overflow:hidden; background:var(--track); }
.vs-seg.p1{ background:var(--p1); } .vs-seg.p2{ background:var(--p2); } .vs-seg.oth{ background:transparent; }
</style>

  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const p1Lead = new Set(ids.slice(0,5)), p2Lead = new Set(ids.slice(5,10));
  STATES.forEach(s=>{
    let p1,p2;
    if(p1Lead.has(s.svgId)){ p1=35+Math.random()*20; p2=8+Math.random()*12; }
    else if(p2Lead.has(s.svgId)){ p2=35+Math.random()*20; p1=8+Math.random()*12; }
    else { p1=5+Math.random()*12; p2=5+Math.random()*12; }
    pop[s.svgId] = {p1, p2, others: Math.max(0,100-p1-p2)};
  });
}
function fmtPct(n){ return Math.round(n)+'%'; }
function leaderColor(id){ const p=pop[id]; if(!p) return COLORS.others;
  if(p.p1>=p.p2 && p.p1>=p.others) return COLORS.p1;
  if(p.p2>=p.p1 && p.p2>=p.others) return COLORS.p2;
  return COLORS.others; }
function paintMap(){ document.querySelectorAll('.india-map path[id]').forEach(p=>{ p.style.fill = leaderColor(p.id); }); }

function updateCard(){
  const s = STATES.find(s=>s.svgId===selectedId); const p = pop[selectedId];
  if(!s||!p) return;
  document.getElementById('cardName').textContent = s.name;
  document.getElementById('cardSeats').textContent = s.seats + ' seats';
  document.getElementById('cardP1Fill').style.width = p.p1+'%';
  document.getElementById('cardOthFill').style.width = p.others+'%';
  document.getElementById('cardP2Fill').style.width = p.p2+'%';
  document.getElementById('cardP1Pct').textContent = fmtPct(p.p1);
  document.getElementById('cardP2Pct').textContent = fmtPct(p.p2);
  const groupsEl = document.getElementById('cardGroups');
  groupsEl.innerHTML = '';
  if(!s.groups.length){
    groupsEl.innerHTML = '<span class="none">No group affiliations</span>';
  } else {
    s.groups.forEach(key=>{
      const g = GROUPS.find(x=>x.key===key); if(!g) return;
      const chip = document.createElement('span');
      chip.className = 'chip'; chip.title = g.label;
      chip.textContent = g.icon;
      groupsEl.appendChild(chip);
    });
  }
}

function updateSeatProjection(){
  let p1s=0,p2s=0; const total=543;
  STATES.forEach(s=>{ const p=pop[s.svgId]; p1s += s.seats*p.p1/100; p2s += s.seats*p.p2/100; });
  const oths = total-p1s-p2s;
  document.getElementById('segP1').style.width = (p1s/total*100)+'%';
  document.getElementById('segOth').style.width = (oths/total*100)+'%';
  document.getElementById('segP2').style.width = (p2s/total*100)+'%';
  document.getElementById('p1Seats').textContent = Math.round(p1s)+' seats';
  document.getElementById('p2Seats').textContent = Math.round(p2s)+' seats';
}

function selectState(id){
  document.querySelectorAll('.india-map path.selected').forEach(p=>p.classList.remove('selected'));
  const el = document.getElementById(id); if(el) el.classList.add('selected');
  selectedId = id; updateCard();
}

function investIn(id, mult){
  const p = pop[id]; if(!p) return;
  const take = Math.min(4*mult, p.others);
  p.others -= take; p.p1 += take;
  if(p.others < 0.5 && p.p1 < 92){ const from = Math.min(2*mult, p.p2); p.p2 -= from; p.p1 += from; }
  paintMap(); updateCard(); updateSeatProjection(); if(activeGroup) applyGroupHighlight();
  const el = document.getElementById(id);
  if(el && el.animate){ el.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:220}); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}

document.getElementById('map').addEventListener('click', e=>{
  const path = e.target.closest('path[id]'); if(!path) return;
  selectState(path.id);
  if(armedToken){
    investIn(path.id, armedToken==='special'?4:2);
    tokenCounts[armedToken]=0;
    showToast(`${armedToken==='special'?'⭐ Special':'📢 Rally'} deployed`);
    armedToken=null; renderTokens();
  } else investIn(path.id, 1);
});

document.getElementById('utsBtn').addEventListener('click', ()=>{
  SMALL_UTS.forEach(id => investIn(id, 1));
  showToast('Invested in all Union Territories');
});

function applyGroupHighlight(){
  const members = !activeGroup ? null : STATES.filter(s=>s.groups.includes(activeGroup)).map(s=>s.svgId);
  document.querySelectorAll('.india-map path[id]').forEach(p=>{ p.style.opacity = (!members || members.includes(p.id)) ? '1' : '0.15'; });
  document.querySelectorAll('.gchip').forEach(c=>c.classList.remove('qualified'));
  const readout = document.getElementById('groupReadout');
  if(!members){ readout.hidden = true; return; }
  const set = STATES.filter(s=>members.includes(s.svgId));
  const seats = set.reduce((a,s)=>a+s.seats,0);
  const qualifying = set.filter(s=>pop[s.svgId].p1>50).length;
  const gdef = GROUPS.find(g=>g.key===activeGroup);
  const qualified = qualifying===set.length;
  if(qualified){ const chip = document.querySelector(`.gchip[data-key="${activeGroup}"]`); if(chip) chip.classList.add('qualified'); }
  readout.hidden = false;
  readout.innerHTML = `<b>${gdef.icon} ${gdef.label}</b> &middot; ${seats} seats &middot; leading ${qualifying}/${set.length}${qualified?' — bonus qualified!':''}`;
}

function buildGroupsBox(){
  const box = document.getElementById('groupsBox');
  GROUPS.forEach(g=>{
    const b = document.createElement('button');
    b.className='gchip'; b.dataset.key=g.key; b.title=g.label;
    b.innerHTML = `${g.icon}<span class="badge"></span>`;
    b.addEventListener('click', ()=>{
      activeGroup = (activeGroup===g.key) ? null : g.key;
      document.querySelectorAll('.gchip').forEach(x=>x.classList.toggle('on', x.dataset.key===activeGroup));
      applyGroupHighlight();
    });
    box.appendChild(b);
  });
}

function renderTokens(){
  document.getElementById('rallyBadge').textContent = tokenCounts.simple;
  document.getElementById('specialBadge').textContent = tokenCounts.special;
  document.getElementById('rallyBtn').classList.toggle('depleted', tokenCounts.simple<=0);
  document.getElementById('specialBtn').classList.toggle('depleted', tokenCounts.special<=0);
  document.getElementById('rallyBtn').classList.toggle('armed', armedToken==='simple');
  document.getElementById('specialBtn').classList.toggle('armed', armedToken==='special');
}
function armToken(type){
  if(tokenCounts[type]<=0) return;
  armedToken = (armedToken===type) ? null : type;
  renderTokens();
  if(armedToken) showToast('Tap a state to deploy');
}
document.getElementById('rallyBtn').addEventListener('click', ()=> armToken('simple'));
document.getElementById('specialBtn').addEventListener('click', ()=> armToken('special'));

document.getElementById('resetBtn').addEventListener('click', ()=>{
  seed(); paintMap(); updateCard(); updateSeatProjection(); applyGroupHighlight();
  tokenCounts.simple=1; tokenCounts.special=1; armedToken=null; renderTokens();
});

seed(); buildGroupsBox(); renderTokens(); paintMap();
selectState('INUP'); updateSeatProjection();
</script>
