<title>__SKIN_TITLE__</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__SHORT_NAME__">
<meta name="theme-color" content="__C_BG__">
<link rel="apple-touch-icon" href="__ICON_DATA_URI__">
<style>
:root{
  --stage-bg:__C_BG__; --chrome-bg:__C_CHROME__; --chrome-bg2:__C_CHROME2__;
  --ink:__C_INK__; --ink-soft:__C_INKSOFT__;
  --p1:__C_P1__; --p2:__C_P2__; --map-base:__C_MAPBASE__; --map-stroke:__C_MAPSTROKE__; --accent:__C_ACCENT__;
  --font-display:__F_DISPLAY__; --font-body:__F_BODY__; --font-mono:__F_MONO__;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overscroll-behavior:none;}
body{ font-family:var(--font-body); background:var(--chrome-bg); color:var(--ink); }
button{ font-family:inherit; border:none; }

.stage{ position:fixed; inset:0; overflow:hidden; display:flex; flex-direction:column; }

/* ---- header: everything persistent lives here, never over the map ---- */
.header{ flex:0 0 auto; background:var(--chrome-bg); padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px; }
.seatbar{ display:flex; height:8px; border-radius:3px; overflow:hidden; background:var(--map-stroke); }
.seatbar .seg{ height:100%; }
.seatbar .seg.p1{ background:var(--p1); }
.seatbar .seg.p2{ background:var(--p2); }
.seatbar .seg.oth{ background:var(--ink-soft); opacity:.55; }

.player-row{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:8px; }
.pchip{ font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; background:var(--chrome-bg2); display:flex; align-items:center; gap:5px; }
.pchip .seats{ opacity:.7; font-size:9.5px; }
.pchip.p1{ color:var(--p1); }
.pchip.p2{ color:var(--p2); }

.info-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; }
.info-text{ flex:1 1 auto; min-width:0; font-size:11.5px; line-height:1.4; }
.info-text b{ font-family:var(--font-display); font-size:12.5px; }
.info-actions{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
.iconbtn{ width:27px; height:27px; border-radius:50%; background:var(--chrome-bg2); display:flex; align-items:center; justify-content:center; font-size:12px; }

/* ---- map: gets everything else, nothing drawn on top of it ---- */
.map-wrap{ position:relative; flex:1 1 auto; min-height:0; background:var(--stage-bg); overflow:hidden; }
.india-map{ position:absolute; inset:0; width:100%; height:100%; }
.india-map path{ fill:var(--map-base); stroke:var(--map-stroke); stroke-width:1; cursor:pointer; transition:opacity .25s ease; }
.india-map path.selected{ stroke:var(--accent); stroke-width:3.5; }

/* floating in the empty NE corner of the map — no state content sits there */
.ut-panel{ position:absolute; top:8px; right:8px; z-index:6; background:var(--chrome-bg); border-radius:8px; padding:6px; box-shadow:0 3px 10px rgba(0,0,0,.3); }
.ut-timer{ font-family:var(--font-mono); font-size:9.5px; font-weight:700; text-align:center; margin-bottom:5px; color:var(--ink-soft); white-space:nowrap; }
.ut-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:3px; }
.utbtn{ width:24px; height:22px; border-radius:5px; background:var(--chrome-bg2); font-family:var(--font-mono); font-size:8.5px; font-weight:700; color:var(--ink); }
.utbtn.selected{ background:var(--accent); color:var(--stage-bg); }

/* ---- footer: group readout (only when active) + the 16-group grid, always one tap away ---- */
.group-banner{ flex:0 0 auto; background:var(--accent); color:var(--stage-bg); padding:7px 12px; font-size:11.5px; line-height:1.4; }
.group-banner b{ font-family:var(--font-display); font-size:12.5px; }
.group-banner[hidden]{ display:none; }

.groups-grid{ flex:0 0 auto; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(2,1fr); gap:4px; padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px); background:var(--chrome-bg); border-top:1px solid var(--map-stroke); }
.gbtn{ display:flex; align-items:center; justify-content:center; font-size:16px; border-radius:7px; background:var(--chrome-bg2); min-height:38px; }
.gbtn.on{ background:var(--accent); box-shadow:inset 0 0 0 2px var(--ink); }

__SKIN_EXTRA_CSS__
</style>

<div class="stage">
  <div class="header">
    <div class="seatbar"><div class="seg p1"></div><div class="seg oth"></div><div class="seg p2"></div></div>
    <div class="player-row">
      <div class="pchip p1">🪷 P1 · ₹2500Cr <span class="seats" id="p1seats">· — seats</span></div>
      <div class="pchip p2"><span class="seats" id="p2seats">seats — ·</span> ₹2500Cr · P2 ✋</div>
    </div>
    <div class="info-row">
      <div class="info-text" id="stateChip">Tap any state to invest</div>
      <div class="info-actions">
        <button class="iconbtn" id="resetBtn" title="Reshuffle demo">↺</button>
        <span class="iconbtn" title="Simple rally token">📢</span>
        <span class="iconbtn" title="Special rally token">⭐</span>
      </div>
    </div>
  </div>

  <div class="map-wrap">
    <svg class="india-map" id="map" viewBox="84 27 833 946" preserveAspectRatio="xMidYMid meet">__MAP_SVG_INNER__</svg>
    <div class="ut-panel">
      <div class="ut-timer">Phase 1/8 · ⏱ 02:45</div>
      <div class="ut-grid" id="utGrid"></div>
    </div>
  </div>

  <div class="group-banner" id="groupChip" hidden></div>
  <div class="groups-grid" id="groupsGrid"></div>
</div>

<script>
const STATES = __STATES_JSON__;
const GROUPS = [
  {key:'All', icon:'🗺️', label:'All'},
  {key:'UnionTerritory', icon:'🏛️', label:'Union Territory'},
  {key:'CoastalIndia', icon:'🌊', label:'Coastal India'},
  {key:'NortheastIndia', icon:'🌄', label:'Northeast India'},
  {key:'SouthIndia', icon:'🌴', label:'South India'},
  {key:'HindiHeartland', icon:'🕉️', label:'Hindi Heartland'},
  {key:'AgriculturalRegion', icon:'🌾', label:'Agricultural Region'},
  {key:'BorderLands', icon:'🛡️', label:'Border Lands'},
  {key:'Pilgrimage', icon:'🙏', label:'Pilgrimage'},
  {key:'IndustrialCorridor', icon:'🏭', label:'Industrial Corridor'},
  {key:'Manufacturing', icon:'⚙️', label:'Manufacturing'},
  {key:'Education', icon:'🎓', label:'Education'},
  {key:'TribalLands', icon:'🌳', label:'Tribal Lands'},
  {key:'TravelAndTourism', icon:'✈️', label:'Travel & Tourism'},
  {key:'NaturalResources', icon:'⛏️', label:'Natural Resources'},
  {key:'MinorityAreas', icon:'🕌', label:'Minority Areas'},
];
const COLORS = { p1:'__C_P1__', p2:'__C_P2__', others:'__C_MAPBASE__' };
const SMALL_UTS = [
  {id:'INDL', label:'DL', title:'Delhi'},
  {id:'INCH', label:'CH', title:'Chandigarh'},
  {id:'INDH', label:'DH', title:'DNH & DD'},
  {id:'INPY', label:'PY', title:'Puducherry'},
  {id:'INLD', label:'LD', title:'Lakshadweep'},
  {id:'INAN', label:'AN', title:'A&N Islands'},
];

let pop = {}, selectedId = 'INUP', activeGroup = 'All';

function seed(){
  const ids = STATES.map(s=>s.svgId).slice();
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const p1Lead = new Set(ids.slice(0,5)), p2Lead = new Set(ids.slice(5,10));
  STATES.forEach(s=>{
    let p1,p2;
    if(p1Lead.has(s.svgId)){ p1=35+Math.random()*20; p2=8+Math.random()*12; }
    else if(p2Lead.has(s.svgId)){ p2=35+Math.random()*20; p1=8+Math.random()*12; }
    else { p1=5+Math.random()*12; p2=5+Math.random()*12; }
    pop[s.svgId] = {p1, p2, others: Math.max(0,100-p1-p2)};
  });
}

function leaderColor(id){
  const p = pop[id]; if(!p) return COLORS.others;
  if(p.p1>=p.p2 && p.p1>=p.others) return COLORS.p1;
  if(p.p2>=p.p1 && p.p2>=p.others) return COLORS.p2;
  return COLORS.others;
}
function paintMap(){ document.querySelectorAll('.india-map path[id]').forEach(p=>{ p.style.fill = leaderColor(p.id); }); }
function fmtPct(n){ return Math.round(n)+'%'; }

function updateStateChip(){
  const s = STATES.find(s=>s.svgId===selectedId);
  const p = pop[selectedId];
  document.getElementById('stateChip').innerHTML = s ? `<b>${s.name}</b> · ${s.seats} seats · P1 ${fmtPct(p.p1)} · P2 ${fmtPct(p.p2)} · Oth ${fmtPct(p.others)}` : 'Tap any state to invest';
}

function updateSeatProjection(){
  let p1s=0,p2s=0,oths=0;
  STATES.forEach(s=>{ const p=pop[s.svgId]; p1s += s.seats*p.p1/100; p2s += s.seats*p.p2/100; oths += s.seats*p.others/100; });
  const total = 543;
  document.querySelector('.seg.p1').style.width = (p1s/total*100)+'%';
  document.querySelector('.seg.oth').style.width = (oths/total*100)+'%';
  document.querySelector('.seg.p2').style.width = (p2s/total*100)+'%';
  document.getElementById('p1seats').textContent = '· '+Math.round(p1s)+' seats';
  document.getElementById('p2seats').textContent = Math.round(p2s)+' seats ·';
}

function selectState(id){
  document.querySelectorAll('.india-map path.selected').forEach(p=>p.classList.remove('selected'));
  const el = document.getElementById(id);
  if(el) el.classList.add('selected');
  document.querySelectorAll('.utbtn.selected').forEach(b=>b.classList.remove('selected'));
  const utBtn = document.querySelector(`.utbtn[data-id="${id}"]`);
  if(utBtn) utBtn.classList.add('selected');
  selectedId = id;
  updateStateChip();
}

function buildUtGrid(){
  const grid = document.getElementById('utGrid');
  SMALL_UTS.forEach(ut=>{
    const b = document.createElement('button');
    b.className = 'utbtn';
    b.dataset.id = ut.id;
    b.textContent = ut.label;
    b.title = ut.title;
    b.addEventListener('click', ()=>{ selectState(ut.id); investIn(ut.id); });
    grid.appendChild(b);
  });
}

function investIn(id){
  const p = pop[id]; if(!p) return;
  const take = Math.min(4, p.others);
  p.others -= take; p.p1 += take;
  if(p.others < 0.5 && p.p1 < 90){ const from = Math.min(2, p.p2); p.p2 -= from; p.p1 += from; }
  paintMap(); updateStateChip(); updateSeatProjection(); applyGroupHighlight();
  const el = document.getElementById(id);
  if(el && el.animate){ el.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:220}); }
}

document.getElementById('map').addEventListener('click', e=>{
  const path = e.target.closest('path[id]');
  if(!path) return;
  selectState(path.id);
  investIn(path.id);
});

function applyGroupHighlight(){
  const members = activeGroup==='All' ? null : STATES.filter(s=>s.groups.includes(activeGroup)).map(s=>s.svgId);
  document.querySelectorAll('.india-map path[id]').forEach(p=>{ p.style.opacity = (!members || members.includes(p.id)) ? '1' : '0.15'; });
  const chip = document.getElementById('groupChip');
  if(!members){ chip.hidden = true; return; }
  const set = STATES.filter(s=>members.includes(s.svgId));
  const seats = set.reduce((a,s)=>a+s.seats,0);
  const qualifying = set.filter(s=>pop[s.svgId].p1>50).length;
  const gdef = GROUPS.find(g=>g.key===activeGroup);
  chip.hidden = false;
  chip.innerHTML = `<b>${gdef.icon} ${gdef.label}</b> · ${seats} seats total · you lead in ${qualifying}/${set.length} states${qualifying===set.length?' — bonus qualified!':' for the dominance bonus'}`;
}

function buildGroupsGrid(){
  const grid = document.getElementById('groupsGrid');
  GROUPS.forEach(g=>{
    const b = document.createElement('button');
    b.className = 'gbtn' + (g.key==='All' ? ' on' : '');
    b.dataset.key = g.key;
    b.innerHTML = `<span>${g.icon}</span>`;
    b.title = g.label;
    b.addEventListener('click', ()=>{
      activeGroup = g.key;
      document.querySelectorAll('.gbtn').forEach(x=>x.classList.toggle('on', x===b));
      applyGroupHighlight();
    });
    grid.appendChild(b);
  });
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  seed(); paintMap(); updateStateChip(); updateSeatProjection(); applyGroupHighlight();
});

seed();
buildGroupsGrid();
buildUtGrid();
paintMap();
selectState('INUP');
updateSeatProjection();
</script>
